name: 'Unit tests'

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

permissions:
  contents: read

# A newer push to a pull request supersedes its older run. Runs on main are
# never cancelled, so every merge gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout pulp-ui (${{ github.ref }})'
        uses: actions/checkout@v7

      - name: 'Install node 24'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # The install runs the prepare script, which builds the sdk to
      # packages/sdk/dist; the application and its tests import that build.
      - name: 'Install dependencies'
        run: npm ci

      # One run covers the application and the sdk workspace.
      - name: 'Unit tests'
        run: npm test

      - name: 'sdk type-check'
        run: npm run typecheck -w @pulp-ui/sdk

      # Generation is offline and deterministic, so the committed generated
      # code must equal a fresh generation from the committed schema. A hand
      # edit of generated code, a schema change committed without its
      # regeneration, or an added file that generation does not write shows up
      # here: the status also lists untracked files and covers the schema and
      # the versions file.
      - name: 'Generated sdk matches the committed schema'
        run: |
          npm run generate -w @pulp-ui/sdk
          changes=$(git status --porcelain packages/sdk)
          if [ -n "$changes" ]; then
            echo "The committed sdk differs from a fresh generation:"
            echo "$changes"
            exit 1
          fi
          # Generated files and the schema are plain 7-bit ASCII.
          nonascii=$(grep -rlP '[^\x00-\x7F]' packages/sdk/src packages/sdk/schema || true)
          if [ -n "$nonascii" ]; then
            echo "Files with a byte above 0x7F:"
            echo "$nonascii"
            exit 1
          fi
