name: 'PR checks'

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

permissions:
  contents: read

# A newer push to a pull request supersedes its older run. Runs on main are
# never cancelled, so every merge gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    # Pinned to a commit so a change in the external repository cannot alter
    # this pipeline unnoticed. The workflow ref and the pulpdocs_ref must match.
    uses: 'pulp/pulp-docs/.github/workflows/docs-ci.yml@22a82dad2765d66701a964bb81a86fc2ced2cd09'
    with:
      pulpdocs_ref: '22a82dad2765d66701a964bb81a86fc2ced2cd09'

  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout pulp-ui (${{ github.ref }})'
        uses: actions/checkout@v7

      - name: 'Install node 24'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: 'Install python 3.13'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 'Checks'
        run: |
          # fail if npm install had to change package-lock.json
          npm install
          git diff --exit-code package-lock.json

          # dependencies
          npm run lint-setup

          # run linters
          npm run lint

          # uses `this` but not `class`
          sudo apt install -y ripgrep
          rg '\bclass\b' src/ | cut -d: -f1 | sort -u > src.class
          rg '\bthis[\.,)\]}]\b' src/ | cut -d: -f1 | sort -u > src.this
          if [ `comm -13 src.class src.this | wc -l` -ne 0 ]; then
            echo
            echo "Files using this but not class:"
            echo
            comm -13 src.class src.this
            echo
            rg '\bthis[\.,)\]}]\b' `comm -13 src.class src.this`
            echo
            exit 1
          fi

  merge-commits:
    # Only a pull request has a range to check; on main the merge commit that
    # brought the pull request in is expected.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      # Full history, so the range base..head can be walked.
      - name: 'Checkout pulp-ui HEAD'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 'Ensure no merge commits'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Fail on merge commits that belong to the pull request itself.
          # The range is limited to the commits of the pull request, so merge
          # commits that are already part of main never fail a pull request.
          # Merging main into a pull request branch adds a merge commit to
          # the range, so rebase the branch instead.
          count=`git log --merges --format=%H "$BASE_SHA..$HEAD_SHA" | tee /dev/stderr | wc -l`
          [ "$count" = 0 ]
