# Serves the production build the way a deployment does, with the Pulp API
# proxied from the same origin. The build is mounted at /usr/share/pulp-ui.
# The application loads its code from /static/pulp_ui/ and its settings from
# /pulp-ui-config.json, and every page under /ui/ is the same index.html whose
# script picks the view from the path. Serving it this way, rather than from a
# development server, catches a build that only works from the root path or
# ships without its message catalogs.

worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    server {
        listen 127.0.0.1:8002;
        server_name _;

        location = /ui {
            return 301 /ui/;
        }
        location /ui/ {
            root /usr/share/pulp-ui;
            try_files /index.html =404;
        }
        location /static/pulp_ui/ {
            alias /usr/share/pulp-ui/;
        }
        location = /pulp-ui-config.json {
            root /usr/share/pulp-ui;
        }

        # The Pulp API of the job's throwaway Pulp, same origin as the UI.
        location /pulp/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $http_host;
        }
    }
}
